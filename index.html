<head>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="kucukkanat" />

  <link rel="canonical" href="https://kucukkanat.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kucukkanat.com/" />
  <meta property="og:title" content="Hilmi Tolga Şahin — kucukkanat" />
  <meta property="og:description" content="Curious, engineer, maker, mathematician. A captain's cabin of an airship at sunset, full of playable projects." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Hilmi Tolga Şahin — kucukkanat" />
  <meta name="twitter:description" content="Curious, engineer, maker, mathematician. Projects you can play, in an airship cabin at sunset." />
  <!-- the first view's models: fetched while the app script downloads (same request mode as three's loader) -->
  <link rel="preload" href="/assets/cabin.glb" as="fetch" crossorigin="anonymous" fetchpriority="high" />
  <link rel="preload" href="/assets/collectibles.glb" as="fetch" crossorigin="anonymous" />
  <!-- self-hosted fonts (src/fonts.css): the subsets the first screen draws with -->
  <link rel="preload" href="/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/fraunces-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/dmsans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // No WebGL → the plain HTML site.
    (function () {
      try {
        var c = document.createElement('canvas');
        if (!(c.getContext('webgl2') || c.getContext('webgl'))) location.replace('/plain/');
      } catch (e) { location.replace('/plain/'); }
    })();
    // The first view's sunset sky and lightmap (KTX2) and the Basis transcoder that unpacks them, fetched alongside the app
    // script (main.ts asks for the same URLs; the lightmap's size follows src/tier.ts — tablets are left to main.ts,
    // since their tier needs the GPU check)
    (function () {
      var add = function (href) {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'fetch'; l.href = href; l.crossOrigin = 'anonymous';
        document.head.appendChild(l);
      };
      try {
        add('/basis/basis_transcoder.js');
        add('/basis/basis_transcoder.wasm');
        add('/assets/sky_sunset.ktx2');
        var q = new URLSearchParams(location.search).get('tier');
        var coarse = matchMedia('(pointer: coarse)').matches, small = Math.min(screen.width, screen.height) < 700;
        var mem = navigator.deviceMemory, save = navigator.connection && navigator.connection.saveData;
        var lite = q === 'lite' || (q !== 'full' && (save || (mem !== undefined && mem < 4) || (coarse && small)));
        if (lite) add('/assets/lightmap_sunset_1k.ktx2');
        else if (q === 'full' || !coarse) add('/assets/lightmap_sunset.ktx2');
      } catch (e) { /* hints only */ }
    })();
  </script>
</head>
<body>
  <noscript><p class="noscript">This site is a 3D cabin that needs JavaScript. <a href="/plain/">Read the plain version</a>.</p></noscript>
  <div id="loader" role="status" aria-live="polite">
    <svg class="wing" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M8 40c10-2 22-10 30-22 3-5 8-9 14-10-2 6-5 11-9 15 4 0 8-1 11-3-3 6-9 10-16 12 3 1 6 1 9 0-6 5-14 7-22 7-7 0-13 1-17 1z" fill="#F07A2A"/>
    </svg>
    <div class="loader-title">kucukkanat</div>
    <div class="loader-bar"><span id="loader-fill"></span></div>
    <div class="loader-text" id="loader-text">Boarding the airship…</div>
    <a class="loader-plain" href="/plain/">Plain version</a>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
